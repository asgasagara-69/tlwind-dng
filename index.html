<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Info Lab Komputer - Asga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: floatSlow 4s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen w-full bg-gradient-to-br from-sky-200 via-amber-50 to-blue-200 flex items-center justify-center p-4 m-0 overflow-x-hidden">

  <!-- KARTU UTAMA (DIJAMIN KETENGAH DENGAN FLEXBOX BODY) -->
  <main class="relative w-full max-w-xl bg-[#FFFDF5]/95 backdrop-blur-md border-[3px] border-[#FDE68A] rounded-[36px] p-8 shadow-2xl shadow-amber-900/10 animate-float my-auto">
    
    <!-- TOP BADGE (ICON KOMPUTER) -->
    <div class="absolute -top-11 left-1/2 -translate-x-1/2">
      <div class="w-22 h-22 p-2 bg-[#FFFDF5] rounded-full border-[3px] border-[#FDE68A] shadow-lg flex items-center justify-center">
        <div class="w-16 h-16 bg-amber-400 rounded-full flex items-center justify-center text-slate-900 shadow-inner">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ORNAMEN TITIK KANAN ATAS -->
    <div class="absolute top-6 right-6 grid grid-cols-3 gap-1 opacity-40">
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
    </div>

    <!-- HEADER TITLE -->
    <div class="text-center mt-6 mb-6">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 flex items-center justify-center gap-2">
        Info Lab <span class="text-amber-500">Komputer</span>
      </h1>
      <div class="flex items-center justify-center gap-2 mt-2">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="text-xs font-bold uppercase tracking-widest text-amber-600/90">PENGUMUMAN PENTING</span>
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      </div>
    </div>

    <!-- CONTENT BOX -->
    <div class="bg-amber-50/70 border border-amber-200/80 rounded-2xl p-6 mb-6 flex items-start gap-4 shadow-sm">
      <div class="p-3.5 bg-amber-400/20 rounded-2xl text-amber-600 shrink-0 border border-amber-300/50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </div>
      <p class="text-slate-700 text-sm leading-relaxed">
        Siswa kelas <strong class="text-slate-900 font-bold">XI RPL</strong> wajib <strong class="text-amber-600 font-bold underline decoration-wavy decoration-amber-400">mematikan komputer</strong> dan <strong class="text-amber-600 font-bold underline decoration-wavy decoration-amber-400">merapikan kursi</strong> masing-masing sebelum meninggalkan ruangan praktik komputer.
      </p>
    </div>

    <!-- GARIS PUTUS-PUTUS -->
    <div class="border-b border-dashed border-amber-200 mb-5"></div>

    <!-- FOOTER AUTHOR SECTION -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-400 to-orange-500 p-0.5 shadow-md flex items-center justify-center text-white font-black text-sm">
          A
        </div>
        <div>
          <span class="font-extrabold text-slate-900 block text-sm">Asga XII – RPL</span>
          <span class="text-slate-500 text-xs">Terima kasih atas kerja sama dan kedisiplinannya.</span>
        </div>
      </div>
      
      <div class="p-2.5 bg-amber-100/80 rounded-xl text-amber-600 border border-amber-200/80 shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
    </div>

    <!-- BOTTOM BADGE BINTANG (MENYATU RAPI DI DALAM KARTU) -->
    <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 bg-[#FFFDF5] border-2 border-[#FDE68A] px-5 py-1.5 rounded-full shadow-md flex items-center gap-1.5 text-amber-400 text-xs font-bold">
      <span>★</span><span>★</span><span>★</span>
    </div>

  </main>

</body>
</html>
